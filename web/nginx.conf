# Serves the static build of the site (see Dockerfile)
server {
    listen 3000;
    root /usr/share/nginx/html;
    server_tokens off;

    # redirects are relative, since the site is served behind CapRover's proxy
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # pages that were removed in the SvelteKit rewrite
    location = /home/statistics {
        return 301 /home;
    }

    location = /home/admin {
        return 301 /home;
    }

    location = /home/notifications/queue {
        return 301 /home/notifications;
    }

    # build files have content hashes in their names, so they never change
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the site is a single-page app: paths that aren't files are handled by the app
    location / {
        try_files $uri /200.html;
    }

    # nginx doesn't know this file type
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # the app's page is always revalidated, so that deploys show up immediately
    location = /200.html {
        add_header Cache-Control "no-cache";
    }
}
