<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple app for keeping track of your resin in Genshin Impact." />
    <meta name="theme-color" content="#2e313d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#2e313d" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#5bbad5" />
    <title>Genshin Schedule</title>

    <script>
      // applies the saved theme before the page is drawn, so that dark mode users don't see a flash of light mode.
      // the app keeps "color-mode" up to date (see src/lib/theme.ts)
      try {
        const mode = localStorage.getItem("color-mode") === "dark" ? "dark" : "light";
        document.documentElement.classList.add(mode);
        document.documentElement.style.colorScheme = mode;
      } catch {
        // storage is unavailable
      }
    </script>

    <style>
      /* the background is set here too, since the stylesheet only arrives with the app's scripts */
      html.dark {
        background-color: #171923;
      }

      /* shown until the app has loaded, including the user's data (see src/routes/+layout.svelte) */
      #boot-progress {
        position: fixed;
        inset: 0 0 auto 0;
        height: 2px;
        overflow: hidden;
        z-index: 1600;
      }

      #boot-progress::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #a3cfff;
        animation: boot-progress 1.2s ease-in-out infinite;
      }

      .dark #boot-progress::after {
        background: white;
      }

      @keyframes boot-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-progress"></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
